name: Hormuz Integrated Risk - Automatic and Manual

on:
  workflow_dispatch:

  schedule:
    # Minden páros órában, UTC szerint, a 35. percben.
    - cron: "35 */2 * * *"

permissions:
  contents: write

concurrency:
  group: hormuz-risk-composite-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-hormuz-composite:
    name: Build Hormuz Risk and Save History
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate input JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = [
              "hormuz-risk.json",
              "hormuz-flow.json",
              "hormuz-live-ais.json",
              "hormuz-vessels.json",
          ]

          for filename in files:
              path = Path(filename)

              if not path.is_file():
                  raise SystemExit(
                      f"ERROR: Missing file: {filename}"
                  )

              with path.open("r", encoding="utf-8") as handle:
                  data = json.load(handle)

              if not isinstance(data, dict):
                  raise SystemExit(
                      f"ERROR: Invalid JSON: {filename}"
                  )

              print(f"OK: {filename}")

          print("All input files validated.")
          PY

      - name: Run Hormuz integration engine
        run: |
          python build_hormuz_risk.py

      - name: Validate composite output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("hormuz-risk-composite.json")

          if not path.is_file():
              raise SystemExit(
                  "ERROR: Composite output missing."
              )

          with path.open("r", encoding="utf-8") as handle:
              data = json.load(handle)

          required = [
              "meta",
              "input_status",
              "layers",
              "composite",
              "publication_guidance",
          ]

          for key in required:
              if key not in data:
                  raise SystemExit(
                      f"ERROR: Missing field: {key}"
                  )

          layers = data["layers"]
          composite = data["composite"]
          publication = data["publication_guidance"]

          for name in [
              "security",
              "physical_flow",
              "logistics",
          ]:
              if name not in layers:
                  raise SystemExit(
                      f"ERROR: Missing layer: {name}"
                  )

          if composite.get("validated") is not False:
              raise SystemExit(
                  "ERROR: Invalid composite validation."
              )

          if composite.get("validated_score") is not None:
              raise SystemExit(
                  "ERROR: Unvalidated score detected."
              )

          if publication.get(
              "final_composite_publishable"
          ) is not False:
              raise SystemExit(
                  "ERROR: Invalid publication flag."
              )

          print("Composite validation successful.")
          print("Status:", composite.get("status"))
          PY

      - name: Save Hormuz history
        run: |
          python save_hormuz_history.py

      - name: Validate history files
        run: |
          python - <<'PY'
          import csv
          import json
          from datetime import datetime
          from pathlib import Path

          root = Path("history/hormuz")

          csv_file = root / "composite-history.csv"
          json_file = root / "composite-history.json"

          for path in [csv_file, json_file]:
              if not path.is_file():
                  raise SystemExit(
                      f"ERROR: Missing history: {path}"
                  )

          with json_file.open("r", encoding="utf-8") as handle:
              records = json.load(handle)

          with csv_file.open(
              "r", encoding="utf-8", newline=""
          ) as handle:
              csv_records = list(csv.DictReader(handle))

          if not isinstance(records, list):
              raise SystemExit(
                  "ERROR: History JSON is not a list."
              )

          if not records:
              raise SystemExit(
                  "ERROR: History is empty."
              )

          if len(records) != len(csv_records):
              raise SystemExit(
                  "ERROR: CSV/JSON record count mismatch."
              )

          ids = [
              item.get("record_id")
              for item in records
          ]

          if len(ids) != len(set(ids)):
              raise SystemExit(
                  "ERROR: Duplicate history records."
              )

          snapshots = list(
              (root / "snapshots").rglob("*.json")
          )

          if not snapshots:
              raise SystemExit(
                  "ERROR: No history snapshots."
              )

          print("=== HISTORY VALIDATION ===")
          print("History records:", len(records))
          print("Snapshots:", len(snapshots))

          times = sorted(
              datetime.fromisoformat(
                  item["timestamp_utc"].replace(
                      "Z", "+00:00"
                  )
              )
              for item in records
              if item.get("timestamp_utc")
          )

          gaps = [
              (b - a).total_seconds() / 3600
              for a, b in zip(times, times[1:])
          ]

          if gaps:
              print(
                  "Maximum history gap (hours):",
                  round(max(gaps), 2)
              )

              print(
                  "History gaps over 3 hours:",
                  sum(g > 3 for g in gaps)
              )

              if gaps[-1] > 3:
                  print(
                      "::warning::Last history interval "
                      "exceeded 3 hours"
                  )

          print("History validation successful.")
          PY

      - name: Create workflow summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          composite = json.loads(
              Path(
                  "hormuz-risk-composite.json"
              ).read_text(encoding="utf-8")
          )

          history = json.loads(
              Path(
                  "history/hormuz/composite-history.json"
              ).read_text(encoding="utf-8")
          )

          meta = composite.get("meta", {})
          layers = composite.get("layers", {})
          result = composite.get("composite", {})

          security = layers.get("security", {})
          physical = layers.get("physical_flow", {})
          logistics = layers.get("logistics", {})

          lines = [
              "# Hormuz Integrated Risk",
              "",
              f"**Generated:** {meta.get('generated_at')}",
              f"**Model:** {meta.get('version')}",
              f"**Status:** {result.get('status')}",
              "",
              "## Risk layers",
              "",
              "| Layer | Weight | Score | Status |",
              "|---|---:|---:|---|",
              (
                  f"| Security | 40% | "
                  f"{security.get('score')} | "
                  f"{security.get('status')} |"
              ),
              (
                  f"| Physical Flow | 35% | "
                  f"{physical.get('score')} | "
                  f"{physical.get('status')} |"
              ),
              (
                  f"| Logistics | 25% | "
                  f"{logistics.get('score')} | "
                  f"{logistics.get('status')} |"
              ),
              "",
              "## History",
              "",
              f"**Saved records:** {len(history)}",
              "",
              (
                  f"**Latest record:** "
                  f"{history[-1].get('timestamp_utc')}"
              ),
              "",
              "> AIS-observed disruption is not "
              "equivalent to physical oil-flow loss.",
              "",
              "> The full risk index remains provisional.",
          ]

          with open(
              os.environ["GITHUB_STEP_SUMMARY"],
              "a",
              encoding="utf-8"
          ) as handle:
              handle.write("\n".join(lines) + "\n")
          PY

      - name: Upload composite and history artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hormuz-risk-and-history
          path: |
            hormuz-risk-composite.json
            history/hormuz/
          if-no-files-found: error
          retention-days: 30

      - name: Commit composite and history
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            hormuz-risk-composite.json \
            history/hormuz/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update Hormuz risk and historical data"

          # Retry publication when another collector pushes.
          published=false

          for attempt in 1 2 3 4 5; do
            echo "Publish attempt ${attempt}/5"

            git fetch origin "${GITHUB_REF_NAME}"

            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              echo "::error::Rebase conflict while publishing Hormuz history"
              exit 1
            fi

            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              published=true
              break
            fi

            sleep $((attempt * 5))
          done

          if [ "${published}" != "true" ]; then
            echo "::error::History publication failed after five attempts"
            exit 1
          fi

          echo "Composite and history saved successfully."
