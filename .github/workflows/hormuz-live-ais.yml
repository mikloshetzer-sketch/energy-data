
name: Hormuz Live AIS

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: hormuz-live-ais-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hormuz-live-ais:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Hormuz Live AIS collector
        run: |
          python fetch_hormuz_live_ais.py

      - name: Validate output
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("hormuz-live-ais.json")

          if not path.exists():
              raise SystemExit(
                  "ERROR: hormuz-live-ais.json was not created"
              )

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          meta = data.get("meta", {})
          status = data.get("source_status", {})
          summary = data.get("summary", {})

          print("=== HORMUZ LIVE AIS VALIDATION ===")
          print("Collector:", meta.get("collector"))
          print("Version:", meta.get("version"))
          print("Generated:", meta.get("generated_at"))
          print("Source:", status.get("status"))
          print(
              "Endpoints:",
              status.get("endpoints_successful"),
              "/",
              status.get("endpoints_total")
          )

          generated = meta.get("generated_at")
          if not generated:
              raise SystemExit("ERROR: Missing generated_at")

          try:
              timestamp = datetime.fromisoformat(
                  generated.replace("Z", "+00:00")
              )
              if timestamp.tzinfo is None:
                  raise ValueError("Timezone missing")
              age = (
                  datetime.now(timezone.utc)
                  - timestamp.astimezone(timezone.utc)
              ).total_seconds() / 60
          except (ValueError, TypeError) as exc:
              raise SystemExit(
                  f"ERROR: Invalid generated_at: {exc}"
              )

          if age > 60 or age < -5:
              raise SystemExit(
                  f"ERROR: Collector output timestamp invalid: {age:.1f} min"
              )

          if status.get("status") != "AVAILABLE":
              raise SystemExit(
                  "ERROR: Live AIS source unavailable"
              )

          successful = status.get("endpoints_successful", 0)
          if successful < 3:
              raise SystemExit(
                  "ERROR: Fewer than 3 endpoints succeeded"
              )

          if not summary.get("available"):
              raise SystemExit(
                  "ERROR: Live AIS summary unavailable"
              )

          crossings = summary.get("crossings", {})
          print("Last poll:", summary.get("last_poll"))
          print("Total ships:", summary.get("total_ships"))
          print("In strait:", summary.get("in_strait"))
          print("Inbound:", crossings.get("inbound"))
          print("Outbound:", crossings.get("outbound"))
          print("Crossings:", crossings.get("total"))

          print("Validation successful.")
          PY

      - name: Write GitHub Actions summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json

          with open("hormuz-live-ais.json", encoding="utf-8") as f:
              data = json.load(f)

          meta = data.get("meta", {})
          summary = data.get("summary", {})
          crossings = summary.get("crossings", {})
          analysis = data.get("live_ais_analysis", {})
          stats = analysis.get("crossing_statistics", {})
          trend = stats.get("trend", {})

          print("## Hormuz Live AIS")
          print()
          print(f"- Generated: {meta.get('generated_at')}")
          print(f"- Ships: {summary.get('total_ships')}")
          print(f"- In strait: {summary.get('in_strait')}")
          print(f"- Inbound (24h): {crossings.get('inbound')}")
          print(f"- Outbound (24h): {crossings.get('outbound')}")
          print(f"- Crossings (24h): {crossings.get('total')}")
          print()
          print("### Traffic trends")
          print()
          print(
              "- 7d vs 30d crossings: "
              f"{trend.get('total_crossings_7d_vs_30d_pct')}%"
          )
          print(
              "- 7d vs 30d outbound: "
              f"{trend.get('outbound_7d_vs_30d_pct')}%"
          )
          print()
          print(
              "AIS-derived estimates are not "
              "direct physical oil-flow measurements."
          )
          PY

      - name: Commit updated live AIS data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add hormuz-live-ais.json

          if git diff --cached --quiet; then
            echo "No live AIS data changes to commit."
            exit 0
          fi

          git commit -m "Update Hormuz live AIS data"

          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
