
name: Hormuz Flow Data

on:
  workflow_dispatch:
  schedule:
    - cron: "43 5 * * *"

permissions:
  contents: write

concurrency:
  group: hormuz-flow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch-hormuz-flow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show Python version
        run: python --version

      - name: Fetch Hormuz flow data
        run: |
          python fetch_hormuz_flow.py

      - name: Validate Hormuz Flow output
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("hormuz-flow.json")

          if not path.exists():
              raise SystemExit(
                  "ERROR: hormuz-flow.json was not generated."
              )

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          meta = data.get("meta", {})
          latest = data.get("latest_observation", {})
          freshness = data.get("freshness", {})
          quality = data.get("data_quality", {})
          reference = data.get("reference_periods", {})
          recent = data.get("recent_windows", {})
          disruption = data.get("ais_observed_disruption", {})

          print("=== HORMUZ PORTWATCH FLOW ===")
          print("Collector:", meta.get("collector"))
          print("Version:", meta.get("version"))
          print("Generated:", meta.get("generated_at"))

          generated = meta.get("generated_at")

          if not generated:
              raise SystemExit(
                  "ERROR: Missing generated_at."
              )

          try:
              timestamp = datetime.fromisoformat(
                  generated.replace("Z", "+00:00")
              )

              if timestamp.tzinfo is None:
                  raise ValueError("Missing timezone")

              age_minutes = (
                  datetime.now(timezone.utc)
                  - timestamp.astimezone(timezone.utc)
              ).total_seconds() / 60

          except (ValueError, TypeError) as exc:
              raise SystemExit(
                  f"ERROR: Invalid generated_at: {exc}"
              )

          if age_minutes > 60 or age_minutes < -5:
              raise SystemExit(
                  f"ERROR: Collector output is not fresh: "
                  f"{age_minutes:.1f} minutes"
              )

          if not latest.get("date"):
              raise SystemExit(
                  "ERROR: Latest observation date missing."
              )

          baseline = reference.get("structural_baseline", {})
          baseline_tankers = (
              baseline.get("n_tanker", {}).get("average")
          )

          if not isinstance(baseline_tankers, (int, float)):
              raise SystemExit(
                  "ERROR: Structural tanker baseline missing."
              )

          if baseline_tankers <= 0:
              raise SystemExit(
                  "ERROR: Invalid structural baseline."
              )

          if not recent.get("7d"):
              raise SystemExit(
                  "ERROR: Recent 7d window missing."
              )

          if not recent.get("30d"):
              raise SystemExit(
                  "ERROR: Recent 30d window missing."
              )

          if disruption.get("final_flow_risk") is not False:
              raise SystemExit(
                  "ERROR: AIS disruption incorrectly marked "
                  "as final physical flow risk."
              )

          seven_day = disruption.get("seven_day", {})
          disruption_score = seven_day.get("disruption_score")

          if not isinstance(disruption_score, (int, float)):
              raise SystemExit(
                  "ERROR: AIS observation score missing."
              )

          if not 0 <= disruption_score <= 100:
              raise SystemExit(
                  "ERROR: AIS disruption outside 0-100."
              )

          print("Latest observation:", latest.get("date"))
          print("Freshness:", freshness.get("status"))
          print("Observation age:", freshness.get("age_days"))
          print("Baseline tankers/day:", baseline_tankers)
          print(
              "Recent 7d tankers/day:",
              recent["7d"].get("n_tanker", {}).get("average")
          )
          print(
              "AIS observed disruption:",
              disruption_score
          )
          print(
              "Data quality:",
              quality.get("level"),
              quality.get("score")
          )

          if freshness.get("status") in (
              "STALE",
              "VERY_STALE"
          ):
              print(
                  "WARNING: PortWatch observations are delayed."
              )

          print("Validation successful.")
          PY

      - name: Write GitHub Actions summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json

          with open("hormuz-flow.json", encoding="utf-8") as f:
              data = json.load(f)

          meta = data.get("meta", {})
          latest = data.get("latest_observation", {})
          freshness = data.get("freshness", {})
          quality = data.get("data_quality", {})
          reference = data.get("reference_periods", {})
          recent = data.get("recent_windows", {})
          disruption = data.get("ais_observed_disruption", {})

          baseline = reference.get("structural_baseline", {})
          seven = recent.get("7d", {})
          thirty = recent.get("30d", {})

          print("## Hormuz PortWatch Flow")
          print()
          print(f"- Generated: {meta.get('generated_at')}")
          print(f"- Version: {meta.get('version')}")
          print(f"- Latest observation: {latest.get('date')}")
          print(f"- Freshness: {freshness.get('status')}")
          print(f"- Observation age: {freshness.get('age_days')} days")
          print()
          print("### AIS-observed tanker traffic")
          print()
          print(
              "- Structural baseline: "
              f"{baseline.get('n_tanker', {}).get('average')} / day"
          )
          print(
              "- Recent 7d: "
              f"{seven.get('n_tanker', {}).get('average')} / day"
          )
          print(
              "- Recent 30d: "
              f"{thirty.get('n_tanker', {}).get('average')} / day"
          )
          print()
          print("### AIS-observed disruption")
          print()
          print(
              "- 7d score: "
              f"{disruption.get('seven_day', {}).get('disruption_score')}"
          )
          print(
              "- 30d score: "
              f"{disruption.get('thirty_day', {}).get('disruption_score')}"
          )
          print()
          print(
              f"- Data quality: {quality.get('level')} "
              f"({quality.get('score')})"
          )
          print()
          print(
              "**Important:** AIS-observed traffic disruption "
              "is not equivalent to physical oil-flow disruption."
          )
          PY

      - name: Commit updated Hormuz Flow data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add hormuz-flow.json

          if git diff --cached --quiet; then
            echo "No PortWatch data changes to commit."
            exit 0
          fi

          git commit -m "Update Hormuz PortWatch flow data"

          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
