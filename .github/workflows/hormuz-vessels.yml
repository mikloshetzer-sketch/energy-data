name: Hormuz Vessel Monitor

on:
  workflow_dispatch:

  schedule:
    # Run every 30 minutes.
    # GitHub Actions cron uses UTC.
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update-hormuz-vessels:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Hormuz vessel collector
        run: |
          python fetch_hormuz_vessels.py

      - name: Validate vessel output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("hormuz-vessels.json")

          if not path.exists():
              raise SystemExit(
                  "ERROR: hormuz-vessels.json was not created."
              )

          data = json.loads(
              path.read_text(encoding="utf-8")
          )

          meta = data.get("meta", {})
          analysis = data.get("analysis", {})
          tracking = data.get("persistent_tracking", {})
          tracking_summary = tracking.get("summary", {})
          quality = data.get("data_quality", {})
          vessels = data.get("vessels", [])

          print("======================================")
          print("HORMUZ VESSEL MONITOR")
          print("======================================")

          print(
              "Version:",
              meta.get("version")
          )

          print(
              "Generated:",
              meta.get("generated_at")
          )

          print()
          print("VESSEL SNAPSHOT")
          print("--------------------------------------")

          print(
              "Total vessels:",
              analysis.get("total_vessels")
          )

          print(
              "Oil-related vessels:",
              analysis.get("oil_related_vessels")
          )

          print(
              "Crude-related vessels:",
              analysis.get("crude_related_vessels")
          )

          print(
              "Product-related vessels:",
              analysis.get("product_related_vessels")
          )

          print(
              "Large oil tankers:",
              analysis.get("large_oil_tankers")
          )

          print(
              "VLCC / ULCC:",
              analysis.get("vlcc_ulcc_count")
          )

          print(
              "Vessel rows:",
              len(vessels)
          )

          print()
          print("BROAD ZONES")
          print("--------------------------------------")

          print(
              "Oil tankers:",
              analysis.get("oil_tankers_by_zone", {})
          )

          print(
              "Crude tankers:",
              analysis.get("crude_tankers_by_zone", {})
          )

          print(
              "VLCC / ULCC:",
              analysis.get("vlcc_ulcc_by_zone", {})
          )

          print()
          print("HORMUZ MICRO ZONES")
          print("--------------------------------------")

          print(
              "Oil tankers:",
              analysis.get(
                  "oil_tankers_by_micro_zone",
                  {}
              )
          )

          print(
              "Crude tankers:",
              analysis.get(
                  "crude_tankers_by_micro_zone",
                  {}
              )
          )

          print(
              "VLCC / ULCC:",
              analysis.get(
                  "vlcc_ulcc_by_micro_zone",
                  {}
              )
          )

          print()
          print("MOVEMENT TRACKING")
          print("--------------------------------------")

          print(
              "Broad zone changes:",
              tracking_summary.get(
                  "zone_changes_this_run",
                  0
              )
          )

          print(
              "Oil tanker broad changes:",
              tracking_summary.get(
                  "oil_tanker_zone_changes_this_run",
                  0
              )
          )

          print(
              "Large tanker broad changes:",
              tracking_summary.get(
                  "large_tanker_zone_changes_this_run",
                  0
              )
          )

          print(
              "VLCC / ULCC broad changes:",
              tracking_summary.get(
                  "vlcc_ulcc_zone_changes_this_run",
                  0
              )
          )

          print()
          print(
              "Micro zone changes:",
              tracking_summary.get(
                  "micro_zone_changes_this_run",
                  0
              )
          )

          print(
              "Oil tanker micro changes:",
              tracking_summary.get(
                  "oil_tanker_micro_zone_changes_this_run",
                  0
              )
          )

          print(
              "Large tanker micro changes:",
              tracking_summary.get(
                  "large_tanker_micro_zone_changes_this_run",
                  0
              )
          )

          print(
              "VLCC / ULCC micro changes:",
              tracking_summary.get(
                  "vlcc_ulcc_micro_zone_changes_this_run",
                  0
              )
          )

          print()
          print("TRANSIT DETECTION")
          print("--------------------------------------")

          print(
              "Confirmed broad transits:",
              tracking_summary.get(
                  "confirmed_transits_this_run",
                  0
              )
          )

          print(
              "Confirmed micro transits:",
              tracking_summary.get(
                  "confirmed_micro_transits_this_run",
                  0
              )
          )

          print(
              "Possible direct transits:",
              tracking_summary.get(
                  "possible_direct_transits_this_run",
                  0
              )
          )

          print(
              "Possible skipped-core transits:",
              tracking_summary.get(
                  "possible_micro_skipped_core_transits_this_run",
                  0
              )
          )

          print()
          print("PERSISTENT TRACKING")
          print("--------------------------------------")

          print(
              "Persistent state vessels:",
              tracking_summary.get(
                  "persistent_state_vessels",
                  0
              )
          )

          print(
              "Confirmed present:",
              tracking_summary.get(
                  "confirmed_present_vessels",
                  0
              )
          )

          print(
              "Temporarily missing:",
              tracking_summary.get(
                  "temporarily_missing_vessels",
                  0
              )
          )

          print(
              "Raw appeared:",
              tracking_summary.get(
                  "raw_appeared_this_run",
                  0
              )
          )

          print(
              "Raw missing:",
              tracking_summary.get(
                  "raw_missing_this_run",
                  0
              )
          )

          print(
              "Confirmed new:",
              tracking_summary.get(
                  "confirmed_new_this_run",
                  0
              )
          )

          print(
              "Confirmed disappeared:",
              tracking_summary.get(
                  "confirmed_disappeared_this_run",
                  0
              )
          )

          print()
          print("DATA QUALITY")
          print("--------------------------------------")

          print(
              "Status:",
              quality.get("status")
          )

          print(
              "Score:",
              quality.get("score")
          )

          print(
              "Snapshot churn:",
              quality.get(
                  "snapshot_churn_pct"
              )
          )

          issues = quality.get(
              "issues",
              []
          )

          if issues:
              print()
              print("Quality warnings:")

              for issue in issues:
                  print(
                      " -",
                      issue
                  )

          if not isinstance(vessels, list):
              raise SystemExit(
                  "ERROR: vessels is not a list."
              )

          if analysis.get("total_vessels") != len(vessels):
              raise SystemExit(
                  "ERROR: vessel count mismatch."
              )

          if len(vessels) == 0:
              raise SystemExit(
                  "ERROR: API returned zero vessel rows."
              )

          print()
          print("TANKER SIZE COUNTS")
          print("--------------------------------------")

          for size, count in (
              analysis
              .get("tanker_size_counts", {})
              .items()
          ):
              print(
                  f"  {size}: {count}"
              )

          print()
          print(
              "Validation completed successfully."
          )
          PY

      - name: Write GitHub Actions summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(
              Path("hormuz-vessels.json")
              .read_text(encoding="utf-8")
          )

          meta = data.get("meta", {})
          analysis = data.get("analysis", {})
          tracking = data.get(
              "persistent_tracking",
              {}
          )
          tracking_summary = tracking.get(
              "summary",
              {}
          )
          quality = data.get(
              "data_quality",
              {}
          )

          summary_path = os.environ.get(
              "GITHUB_STEP_SUMMARY"
          )

          if not summary_path:
              raise SystemExit(0)

          lines = [
              "# Hormuz Vessel Monitor",
              "",
              f"**Version:** {meta.get('version')}",
              "",
              f"**Generated:** {meta.get('generated_at')}",
              "",
              "## Vessel snapshot",
              "",
              f"- Total vessels: **{analysis.get('total_vessels')}**",
              f"- Oil-related vessels: **{analysis.get('oil_related_vessels')}**",
              f"- Crude-related vessels: **{analysis.get('crude_related_vessels')}**",
              f"- Product-related vessels: **{analysis.get('product_related_vessels')}**",
              f"- Large oil tankers: **{analysis.get('large_oil_tankers')}**",
              f"- VLCC / ULCC: **{analysis.get('vlcc_ulcc_count')}**",
              "",
              "## Hormuz micro zones",
              "",
              f"- Oil tankers: **{analysis.get('oil_tankers_by_micro_zone', {})}**",
              f"- Crude tankers: **{analysis.get('crude_tankers_by_micro_zone', {})}**",
              f"- VLCC / ULCC: **{analysis.get('vlcc_ulcc_by_micro_zone', {})}**",
              "",
              "## Movement",
              "",
              f"- Oil tanker broad-zone changes: **{tracking_summary.get('oil_tanker_zone_changes_this_run', 0)}**",
              f"- Oil tanker micro-zone changes: **{tracking_summary.get('oil_tanker_micro_zone_changes_this_run', 0)}**",
              f"- Large tanker micro-zone changes: **{tracking_summary.get('large_tanker_micro_zone_changes_this_run', 0)}**",
              f"- VLCC / ULCC micro-zone changes: **{tracking_summary.get('vlcc_ulcc_micro_zone_changes_this_run', 0)}**",
              "",
              "## Transit detection",
              "",
              f"- Confirmed broad transits: **{tracking_summary.get('confirmed_transits_this_run', 0)}**",
              f"- Confirmed micro transits: **{tracking_summary.get('confirmed_micro_transits_this_run', 0)}**",
              f"- Possible direct transits: **{tracking_summary.get('possible_direct_transits_this_run', 0)}**",
              f"- Possible skipped-core transits: **{tracking_summary.get('possible_micro_skipped_core_transits_this_run', 0)}**",
              "",
              "## Persistent tracking",
              "",
              f"- Confirmed present: **{tracking_summary.get('confirmed_present_vessels', 0)}**",
              f"- Temporarily missing: **{tracking_summary.get('temporarily_missing_vessels', 0)}**",
              f"- Raw appeared: **{tracking_summary.get('raw_appeared_this_run', 0)}**",
              f"- Raw missing: **{tracking_summary.get('raw_missing_this_run', 0)}**",
              "",
              "## Data quality",
              "",
              f"- Status: **{quality.get('status')}**",
              f"- Score: **{quality.get('score')}**",
              f"- Snapshot churn: **{quality.get('snapshot_churn_pct')}%**",
              "",
              "## Important",
              "",
              "AIS vessel observations are not direct physical oil-flow measurements.",
              "",
              "Micro-zone transit detection is an AIS logistics indicator.",
              "",
              "No Hormuz Risk, physical Flow or OMPI model has been modified.",
          ]

          with open(
              summary_path,
              "a",
              encoding="utf-8"
          ) as handle:
              handle.write(
                  "\n".join(lines)
              )
              handle.write("\n")
          PY

      - name: Commit updated vessel snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add hormuz-vessels.json

          if git diff --cached --quiet; then
            echo "No vessel data changes to commit."
            exit 0
          fi

          git commit -m "Update Hormuz vessel snapshot"

          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
