name: Hormuz API Identity Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hormuz-api-identity-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run read-only API diagnostic
        run: python diagnose_hormuz_api.py

      - name: Validate privacy and schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('hormuz-api-identity-diagnostic.json')
          if not p.is_file():
              raise SystemExit('Missing diagnostic JSON')
          d = json.loads(p.read_text(encoding='utf-8'))
          assert d['meta']['version'] == '1.0'
          assert d['source']['vessel_records'] > 0
          assert d['privacy'] == {
              'raw_vessel_records_exported': False,
              'identifiers_exported': False,
              'coordinates_exported': False,
          }
          assert d['assessment']['identifier_values_validated'] is False
          print('Diagnostic schema and privacy flags OK')
          PY

      - name: Publish diagnostic JSON
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hormuz-api-identity-diagnostic.json
          if git diff --cached --quiet; then
            echo 'No changes to publish.'
            exit 0
          fi
          git commit -m 'diagnostics: inspect Hormuz API identity fields'
          for attempt in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep 5
          done
          echo 'Unable to publish diagnostic JSON' >&2
          exit 1
